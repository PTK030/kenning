[workspace]
resolver = "3"
members = ["crates/kenning-core", "crates/kenning-cli", "crates/kenning-labels", "crates/kenning-net", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/PTK030/kenning"
authors = ["Kamil"]

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
