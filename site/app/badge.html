<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <!-- Before the window's styles arrive: the frame's colour scheme (or the
         browser paints the frame opaque) and the window's own background. -->
    <meta name="color-scheme" content="light dark" />
    <style>
      html {
        background: transparent;
      }
    </style>
    <title>Kenning</title>
  </head>
  <body data-window="badge">
    <div id="badge" role="status" aria-live="polite"></div>
    <!-- The desktop app's corner badge, fed by the hero (src/app/badge.ts). -->
    <script type="module" src="../src/app/badge.ts"></script>
  </body>
</html>
