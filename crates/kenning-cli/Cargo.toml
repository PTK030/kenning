[package]
name = "kenning-cli"
description = "ken: know what you copied"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "ken"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
anstream = "1.0.0"
anstyle = "1.0.14"
clap = { version = "4.6.7", features = ["derive"] }
jiff = "0.2.38"
kenning-core = { path = "../kenning-core", version = "0.1.0" }
kenning-net = { path = "../kenning-net", version = "0.1.0" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
serde_json = "1.0.151"
