name: Release

# Push a tag vX.Y.Z (the version in Cargo.toml, package.json and
# tauri.conf.json) and this builds the signed installers, the updater's
# latest.json and their checksums into a draft release. Read it over, then
# publish it: only a published release reaches the app's updater.
# docs/releasing.md has the whole procedure.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build again, e.g. v0.1.0"
        required: true
        type: string

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  windows:
    name: build and draft (windows)
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write # the draft release and its files
      id-token: write # build provenance
      attestations: write
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Check the version and the update key
        shell: bash
        run: node .github/scripts/release-check.mjs "$TAG"

      - name: Release notes from CHANGELOG.md
        id: notes
        shell: bash
        run: |
          node .github/scripts/changelog-section.mjs "${TAG#v}" > "$RUNNER_TEMP/notes.md"
          {
            echo "body<<KENNING_NOTES_END"
            cat "$RUNNER_TEMP/notes.md"
            echo "KENNING_NOTES_END"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install the desktop app's packages
        working-directory: apps/desktop
        run: npm ci
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      # Builds the installers, signs them for the updater (.sig) and writes
      # latest.json pointing at the NSIS installer, which updates in place.
      - name: Build, sign and draft
        id: tauri
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: ${{ env.TAG }}
          releaseName: Kenning ${{ env.TAG }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          # Only releases make the updater's signatures (they need the key).
          args: --config src-tauri/tauri.release.conf.json

      - name: Checksums
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd target/release/bundle
          sha256sum nsis/*.exe msi/*.msi | sed 's#  [a-z]*/#  #' > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release upload "$TAG" SHA256SUMS.txt --clobber

      # Who built the installers, from which commit: checkable with
      # `gh attestation verify`. GitHub offers this for public repositories.
      - name: Build provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
