[package]
name = "kenning-desktop"
description = "Kenning tray app: know what you copied"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "kenning"
path = "src/main.rs"

# The workspace forbids unsafe code. The desktop shell needs a few Win32
# calls (no-activate windows, clipboard format checks), isolated in
# src/platform/windows.rs, so it denies unsafe instead and allows it there.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
jiff = "0.2.38"
kenning-core = { path = "../../../crates/kenning-core", version = "0.1.0" }
kenning-net = { path = "../../../crates/kenning-net", version = "0.1.0" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"

[target."cfg(windows)".dependencies]
clipboard-win = { version = "5", features = ["monitor"] }
winreg = "0.56.0"
